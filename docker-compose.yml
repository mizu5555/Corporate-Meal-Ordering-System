services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      ROOT_PATH: ${ROOT_PATH:-}
    volumes:
      - uploads:/app/uploads
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    build:
      context: .
      dockerfile: backend/db/Dockerfile
    env_file:
      - .env.example
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  gateway:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    container_name: ${GATEWAY_CONTAINER_NAME:-mealorder-dev-gateway}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/srv/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads:
