services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      ROOT_PATH: ${ROOT_PATH:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-meal_user}:${POSTGRES_PASSWORD:-change-me-in-local-env}@db:5432/${POSTGRES_DB:-meal_ordering}
    volumes:
      - uploads:/app/uploads
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    networks:
      default:
        # Caddyfile references the backend as `api:8000`. Declaring the alias
        # in the base compose keeps local-dev (no override) working; staging
        # and prod overrides keep the alias on default while joining
        # grafana_default for the Prometheus scrape path.
        aliases:
          - api
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BASE_PATH: ${BASE_PATH:-/}
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    build:
      context: .
      dockerfile: backend/db/Dockerfile
    env_file:
      - .env.example
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  gateway:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    container_name: ${GATEWAY_CONTAINER_NAME:-mealorder-dev-gateway}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/srv/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads:
