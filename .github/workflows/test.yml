name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest backend/tests --ignore=backend/tests/integration -q

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealorder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mealorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt psycopg[binary]
      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mealorder \
            -f backend/db/migrations/001_initial_schema.sql
      - name: Run integration tests
        run: pytest backend/tests/integration -q

  sonar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealorder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mealorder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt psycopg[binary]
      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mealorder \
            -f backend/db/migrations/001_initial_schema.sql
      - name: Run tests with coverage
        run: pytest backend/tests --cov=backend --cov-report=xml -q
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  meta:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_tag=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: [integration, meta]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend,  context: ".",          file: "backend/Dockerfile" }
          - { name: frontend, context: "./frontend", file: "./frontend/Dockerfile" }
          - { name: db,       context: ".",          file: "backend/db/Dockerfile" }
          - { name: gateway,  context: ".",          file: "infra/caddy/Dockerfile" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/mizu5555/mealorder-${{ matrix.name }}:${{ needs.meta.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Push a single self-contained image manifest per tag. With the default
          # provenance/SBOM attestations the tag becomes an index referencing
          # UNTAGGED child manifests; the hourly GHCR prune (Jenkinsfile.cleanup
          # ids_untagged) then deletes those children, corrupting the tagged image
          # into "manifest unknown" on pull (broke pr-110 / pr-117 previews).
          provenance: false
          sbom: false
      - name: Verify pushed image is pullable
        # Fail loudly if the tag did not land as a complete, pullable manifest,
        # instead of a green build-push followed by a silent "manifest unknown".
        run: docker buildx imagetools inspect "ghcr.io/mizu5555/mealorder-${{ matrix.name }}:${{ needs.meta.outputs.image_tag }}"

  promote:
    needs: integration
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag sha image to version
        run: |
          SHA="sha-${GITHUB_SHA::12}"
          VER="${GITHUB_REF_NAME}"
          for svc in backend frontend db gateway; do
            docker buildx imagetools create \
              -t "ghcr.io/mizu5555/mealorder-${svc}:${VER}" \
              "ghcr.io/mizu5555/mealorder-${svc}:${SHA}"
          done

  deploy-staging:
    needs: [build-push, meta]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins staging
        run: |
          curl -fsS -X POST \
            "${{ secrets.JENKINS_URL }}/job/Meal-Ordering-Project/job/meal-deploy-staging/buildWithParameters?IMAGE_TAG=${{ needs.meta.outputs.image_tag }}&token=${{ secrets.JENKINS_STAGING_TOKEN }}" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}"

  deploy-preview:
    needs: [build-push, meta]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins preview
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          PR_BRANCH_ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['PR_BRANCH'],safe=''))")
          curl -fsS -X POST \
            "${{ secrets.JENKINS_URL }}/job/Meal-Ordering-Project/job/meal-deploy-preview/buildWithParameters?IMAGE_TAG=${{ needs.meta.outputs.image_tag }}&PR_NUMBER=${{ github.event.number }}&PR_BRANCH=${PR_BRANCH_ENC}&token=${{ secrets.JENKINS_PREVIEW_TOKEN }}" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}"

  deploy-prod:
    needs: promote
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins prod
        run: |
          curl -fsS -X POST \
            "${{ secrets.JENKINS_URL }}/job/Meal-Ordering-Project/job/meal-deploy-prod/buildWithParameters?IMAGE_TAG=${{ github.ref_name }}&token=${{ secrets.JENKINS_PROD_TOKEN }}" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}"
