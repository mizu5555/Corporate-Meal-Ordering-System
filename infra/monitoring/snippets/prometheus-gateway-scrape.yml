# Snippet to append to the Grafana host's prometheus.yml on the deploy host.
# Adds scrape jobs for the Caddy gateway's :2019 metrics listener, which is
# joined to grafana_default by both staging and prod compose overrides. Reload
# Prometheus via `docker exec <prometheus-container> kill -HUP 1` after editing
# (no full restart needed thanks to --web.enable-lifecycle).
#
# Existing backend scrape jobs stay unchanged. Concrete host paths and container
# names live in the local ops runbook, not in this public repo.

scrape_configs:
  - job_name: mealorder-staging-gateway
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['mealorder-staging-gateway:2019']
        labels:
          env: staging
          component: gateway

  - job_name: mealorder-prod-gateway
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['mealorder-prod-gateway:2019']
        labels:
          env: prod
          component: gateway
